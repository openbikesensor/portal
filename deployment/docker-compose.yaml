networks:
  gateway:
    external: true
    name: gateway
  backend:
    internal: true

services:

  ############################################################
  # Portal
  ############################################################

  postgres:
    image: "openmaptiles/postgis:7.1"
    environment:
      - POSTGRES_DB=${OBS_POSTGRES_DB:-obs}
      - POSTGRES_USER=${OBS_POSTGRES_USER:-obs}
      - POSTGRES_PASSWORD=${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD is required}
    volumes:
    - ./data/postgres/data:/var/lib/postgresql/data
    networks:
      - backend

  portal:
    image: openbikesensor-portal
    build:
      context: ./source
    env_file: .env
    environment:
      - OBS_POSTGRES_DB=${OBS_POSTGRES_DB:-obs}
      - OBS_POSTGRES_USER=${OBS_POSTGRES_USER:-obs}
      - OBS_POSTGRES_PASSWORD=${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD is required}
      - OBS_POSTGRES_URL=postgresql+asyncpg://obs:${OBS_POSTGRES_PASSWORD}@postgres/obs
      - OBS_POSTGRES_MAX_OVERFLOW=${OBS_POSTGRES_MAX_OVERFLOW:-20}
      - OBS_POSTGRES_POOL_SIZE=${OBS_POSTGRES_POOL_SIZE:-40}
      - OBS_SECRET=${OBS_SECRET:?OBS_SECRET needs to be initialized with random value (e.g. uuid)}
      - OBS_HOST=${OBS_HOST:-0.0.0.0}
      - OBS_PORT=${OBS_PORT:3000}
      - OBS_KEYCLOAK_CLIENT_SECRET=${OBS_KEYCLOAK_CLIENT_SECRET:?OBS_KEYCLOAK_CLIENT_SECRET needs to be set to the keycloak realm client secret}
    volumes:
      - ./data/api-data:${OBS_DATA_DIR}
      - ./config/config.py:/opt/obs/api/config.py
      - ./data/tiles/:/tiles
      - ./data/pbf/:/pbf
    restart: on-failure
    depends_on:
      - traefik
      - postgres
      - worker
    # - keycloak
    labels:
      - traefik.http.routers.portal.rule=Host(`${OBS_PORTAL_URI}`)
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls=true
      - traefik.http.routers.portal.tls.certresolver=leresolver
      - traefik.docker.network=gateway
#      - traefik.http.services.portal.loadbalancer.server.port=3000
    networks:
      - gateway
      - backend

  worker:
    image: openbikesensor-portal
    build:
      context: ./source
    env_file: .env
    environment:
      - OBS_POSTGRES_DB=${OBS_POSTGRES_DB:-obs}
      - OBS_POSTGRES_USER=${OBS_POSTGRES_USER:-obs}
      - OBS_POSTGRES_URL=postgresql+asyncpg://obs:${OBS_POSTGRES_PASSWORD}@postgres/obs
      - OBS_POSTGRES_PASSWORD=${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD is required}
    volumes:
      - ./data/api-data:${OBS_DATA_DIR:-/data}
      - ./config/config.py:/opt/obs/api/config.py
    restart: on-failure
    depends_on:
      - postgres
    networks:
      - backend
    command:
      - python
      - tools/process_track.py

  ############################################################
  # Traefik
  ############################################################

  traefik:
    image: traefik:3
    restart: always
    ports:
      - "80:80"
      - "443:443"
     # The Web UI (enabled by [api] in traefik.toml)
     # - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.toml:/traefik.toml
      - ./config/usersfile:/usersfile
      - ./config/acme:/acme

    networks:
      - gateway

    labels:
      # global redirect from http to https
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      # Define middlewares to be used
      - "traefik.http.routers.http-catchall.middlewares=redirect-http-to-https"
      # Configure middlewares
      - "traefik.http.middlewares.redirect-http-to-https.redirectscheme.scheme=https"

  ############################################################
  # Keycloak
  ############################################################

  keycloak:
    image: "quay.io/keycloak/keycloak:latest"
    restart: always
    networks:
      - gateway
      - backend
    env_file: .env
    environment:
      # database
      - KC_DB=postgres
      - KC_HOSTNAME=${OBS_KEYCLOAK_HOSTNAME}
      - KC_DB_URL=jdbc:postgresql://${OBS_KEYCLOAK_POSTGRES_HOST:-postgres-keycloak}:5432/${OBS_KEYCLOAK_POSTGRES_DB:-keycloak}
      - KC_DB_USERNAME=${OBS_KEYCLOAK_POSTGRES_USER:-keycloak}
      - KC_DB_PASSWORD=${OBS_KEYCLOAK_POSTGRES_PASSWORD:?need to set secure OBS_KEYCLOAK_POSTGRES_PASSWORD}
      # admin user
      - KC_USER=${OBS_KEYCLOAK_ADMIN_USER:-admin}
      - KC_PASSWORD=${OBS_KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${OBS_KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${OBS_KEYCLOAK_ADMIN_PASSWORD:?need to set secure OBS_KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=false
      - KC_PROXY=edge
      - PROXY_ADDRESS_FORWARDING=true
      - OBS_KEYCLOAK_PORTAL_REDIRECT_URI=${OBS_KEYCLOAK_PORTAL_REDIRECT_URI}
    depends_on:
      - traefik
      - postgres-keycloak
    labels:
      - "traefik.http.routers.login.rule=Host(`${OBS_PORTAL_URI}`) && PathMatch(`/auth`)"
      - "traefik.http.routers.login.entrypoints=websecure"
      - "traefik.http.routers.login.tls=true"
      - "traefik.http.routers.login.tls.certresolver=leresolver"
      # This container runs on two ports (8080/tcp, 8443/tcp). Tell traefik, which one to use.
      - "traefik.http.services.login.loadbalancer.server.port=8080"
      # This container runs on more than one network. Tell traefik, which one to use.
      - "traefik.docker.network=gateway"

  postgres-keycloak:
    image: postgres:17
    restart: always
    networks:
      - backend
    volumes:
    - ./data/postgres-keycloak:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${OBS_KEYCLOAK_POSTGRES_DB:-keycloak}
      - POSTGRES_USER=${OBS_KEYCLOAK_POSTGRES_USER:-keycloak}
      - POSTGRES_PASSWORD=${OBS_KEYCLOAK_POSTGRES_PASSWORD}
    labels:
      - traefik.enable=false
